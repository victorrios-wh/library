<p>Libros encontrados: {{ books|length }} libro{{ books|pluralize }}.</p>

<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Titulo</th>
            <th scope="col">Editor</th>
            <th scope="col">Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for book in books %}
            <tr>
                <th scope="row">{{ book.id }}</th>
                <td>{{ book.titulo }}</td>
                <td>{{ book.editor }}</td>
                <td>
                    <a class="btn btn-primary" href="{% if origin == 'func' %}{% url 'biblioteca:editar_libro_func' book.id %}{% else %}{% url 'biblioteca:editar_libro_cbv' book.id %}{% endif %}">Editar</a>
                    <a class="btn btn-danger" href="{% if origin == 'func' %}{% url 'biblioteca:eliminar_libro_func' book.id %}{% else %}{% url 'biblioteca:eliminar_libro_cbv' book.id %}{% endif %}">Eliminar</a>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
